<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tracker</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #17181A;
    color: #F2F1EC;
    min-height: 100vh;
    padding: 24px 16px 40px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 12px; }
  .date { font-size: 12px; color: #9A9890; font-variant-numeric: tabular-nums; }
  .title { font-size: 24px; font-weight: 700; margin-top: 3px; letter-spacing: -0.5px; }
  .undo-btn {
    display: flex; align-items: center; gap: 6px;
    background: #222325; border: 1px solid #343537; border-radius: 10px;
    color: #C9C7BF; font-size: 13px; font-family: inherit;
    padding: 8px 12px; cursor: pointer; flex-shrink: 0;
  }
  .undo-btn svg { width: 16px; height: 16px; }
  .undo-btn:disabled { opacity: 0.35; cursor: default; }
  .undo-btn:not(:disabled):active { background: #2A2B2D; }
  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    background: #1D1E20; padding: 5px; border-radius: 12px;
  }
  .tab {
    flex: 1; height: 40px; border: none; border-radius: 9px;
    background: none; color: #8B8981; font-size: 13.5px; font-weight: 600;
    font-family: inherit; cursor: pointer; padding: 0 2px;
  }
  .tab.active { background: #2E2F32; color: #F2F1EC; }
  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 4px; border-bottom: 1px solid #2A2B2D;
  }
  .item.editing { align-items: flex-start; }
  .item.dragging { opacity: 0.35; }
  .item.drag-over-top { box-shadow: inset 0 2px 0 0 #E8734A; }
  .item.drag-over-bottom { box-shadow: inset 0 -2px 0 0 #E8734A; }
  .drag-handle {
    width: 20px; height: 24px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #4E4D49; cursor: grab; touch-action: none;
  }
  .drag-handle svg { width: 16px; height: 16px; }
  .drag-handle:active { cursor: grabbing; color: #8B8981; }
  .checkbox {
    width: 24px; height: 24px; flex-shrink: 0;
    border: 1.5px solid #5A5850; border-radius: 7px;
    cursor: pointer;
  }
  .checkbox:active { background: #2A2B2D; }
  .item-main { flex: 1; min-width: 0; }
  .item-text {
    font-size: 15px; line-height: 1.4;
    color: #F2F1EC; word-break: break-all; white-space: pre-wrap;
  }
  .due-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; color: #7FA88F;
    font-variant-numeric: tabular-nums;
  }
  .due-badge.overdue { color: #E8734A; }
  .due-badge svg { width: 12px; height: 12px; flex-shrink: 0; }
  .due-badge-row { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .due-cal-btn {
    display: inline-flex; align-items: center; gap: 3px;
    background: none; border: 1px solid #343537; border-radius: 6px;
    color: #8B8981; font-size: 10.5px; font-family: inherit;
    padding: 2px 7px; cursor: pointer;
  }
  .due-cal-btn svg { width: 11px; height: 11px; }
  .due-cal-btn:active { color: #E8E6DF; background: #222325; }
  .edit-input {
    flex: 1; padding: 8px 12px;
    background: #222325; border: 1px solid #E8734A; border-radius: 9px;
    color: #F2F1EC; font-size: 15px; font-family: inherit; outline: none;
    resize: none; line-height: 1.4; min-height: 38px; overflow: hidden;
  }
  .icon-btn {
    width: 32px; height: 32px; flex-shrink: 0;
    background: none; border: none; padding: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 8px;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.edit { color: #8B8981; }
  .icon-btn.del { color: #8B8981; }
  .icon-btn.del:active { color: #E8734A; background: #222325; }
  .icon-btn.restore { color: #8B8981; }
  .icon-btn.restore:active { color: #E8E6DF; background: #222325; }
  .icon-btn.edit:active { background: #222325; }
  .icon-btn.save { color: #E8734A; }
  .icon-btn.cancel { color: #8B8981; }
  .icon-btn.due { color: #8B8981; }
  .icon-btn.due.set { color: #7FA88F; }
  .icon-btn.due.overdue { color: #E8734A; }
  .icon-btn.due:active { background: #222325; }
  .due-form { display: flex; flex-direction: column; gap: 10px; }
  .due-form-row { display: flex; gap: 8px; }
  .due-form input[type="date"], .due-form input[type="time"],
  .rt-form input[type="date"], .rt-form input[type="number"], .rt-form select, .rt-form textarea,
  .sched-dt input[type="date"], .sched-dt input[type="time"] {
    background: #17181A; border: 1px solid #343537; border-radius: 9px;
    color: #F2F1EC; font-size: 14px; font-family: inherit; outline: none;
    color-scheme: dark;
  }
  .due-form input[type="date"], .due-form input[type="time"] { flex: 1; height: 40px; padding: 0 10px; }
  .due-form-btns { display: flex; gap: 8px; }
  .due-form-btns button, .rt-form-btns button {
    flex: 1; height: 38px; border-radius: 9px; border: none;
    font-size: 13px; font-family: inherit; cursor: pointer; font-weight: 600;
  }
  .due-save { background: #E8734A; color: #17181A; }
  .due-clear { background: #343537; color: #C9C7BF; }
  .due-cancel { background: none; color: #8B8981; }
  .add-row { display: flex; gap: 8px; margin-top: 18px; align-items: flex-end; }
  .add-input {
    flex: 1; padding: 12px 14px;
    background: #222325; border: 1px solid #343537; border-radius: 11px;
    color: #F2F1EC; font-size: 15px; font-family: inherit; outline: none;
    resize: none; line-height: 1.4; min-height: 46px; overflow: hidden;
  }
  .add-input::placeholder { color: #6E6C64; }
  .add-btn {
    width: 46px; height: 46px; flex-shrink: 0;
    background: #E8734A; border: none; border-radius: 11px;
    color: #17181A; font-size: 24px; font-weight: 600; cursor: pointer;
  }
  .add-btn:active { background: #d1633d; }
  .sched-dt { display: flex; gap: 8px; margin-top: 10px; }
  .sched-dt input { flex: 1; height: 42px; padding: 0 10px; }
  .empty { text-align: center; color: #6E6C64; font-size: 14px; padding: 30px 0; }
  .status { font-size: 12px; margin-top: 12px; min-height: 14px; }
  .status.sync { color: #6E6C64; }
  .status.err { color: #E8734A; }
  .sec-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 26px; padding-top: 16px; border-top: 1px solid #2A2B2D;
  }
  .sec-header.flat { margin-top: 4px; padding-top: 0; border-top: none; }
  .sec-title {
    display: flex; align-items: center; gap: 7px;
    font-size: 14px; color: #C9C7BF; cursor: pointer;
    background: none; border: none; font-family: inherit; padding: 4px 0;
  }
  .sec-title .chev { width: 15px; height: 15px; transition: transform .2s; color: #8B8981; }
  .sec-title .chev.collapsed { transform: rotate(-90deg); }
  .sec-count { color: #6E6C64; }
  .sec-action {
    background: none; border: none; color: #8B8981;
    font-size: 13px; font-family: inherit; cursor: pointer; padding: 4px 6px;
  }
  .sec-action:active { color: #E8734A; }
  .rt-item { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px solid #232427; }
  .rt-main { flex: 1; min-width: 0; }
  .rt-text { font-size: 15px; line-height: 1.4; color: #F2F1EC; word-break: break-all; white-space: pre-wrap; }
  .rt-meta {
    display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap;
    font-size: 11.5px; color: #7FA88F; margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .rt-meta.overdue { color: #E8734A; }
  .rt-meta svg { width: 12px; height: 12px; flex-shrink: 0; }
  .rt-last { opacity: 0.65; }
  .rt-form {
    padding: 12px; margin: 8px 0;
    background: #1D1E20; border: 1px solid #2A2B2D; border-radius: 11px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .rt-form textarea {
    width: 100%; padding: 10px 12px; resize: none; line-height: 1.4;
    min-height: 42px; overflow: hidden; font-size: 15px;
  }
  .rt-form-row { display: flex; gap: 8px; align-items: center; }
  .rt-form input[type="number"] { width: 70px; height: 40px; padding: 0 10px; text-align: center; }
  .rt-form select { flex: 1; height: 40px; padding: 0 10px; }
  .rt-form input[type="date"] { flex: 1.4; height: 40px; padding: 0 10px; }
  .rt-form-label { font-size: 12px; color: #8B8981; }
  .rt-form-btns { display: flex; gap: 8px; }
  .comp-item { display: flex; align-items: center; gap: 10px; padding: 10px 4px; }
  .comp-check { width: 19px; height: 19px; color: #6E7A70; flex-shrink: 0; }
  .comp-text { flex: 1; font-size: 14px; color: #8B8981; text-decoration: line-through; word-break: break-all; line-height: 1.4; white-space: pre-wrap; }
  .comp-time { font-size: 11px; color: #5F5E5A; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  /* ===== 메모 ===== */
  .memo-toolbar { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .memo-new-btn {
    display: flex; align-items: center; gap: 6px;
    background: #E8734A; border: none; border-radius: 10px;
    color: #17181A; font-size: 13.5px; font-weight: 700; font-family: inherit;
    padding: 9px 14px; cursor: pointer;
  }
  .memo-new-btn:active { background: #d1633d; }
  .memo-card {
    display: flex; gap: 12px; padding: 14px 4px;
    border-bottom: 1px solid #2A2B2D; cursor: pointer;
  }
  .memo-card:active { background: #1D1E20; }
  .memo-thumb {
    width: 56px; height: 56px; border-radius: 10px; object-fit: cover;
    flex-shrink: 0; background: #222325;
  }
  .memo-card-main { flex: 1; min-width: 0; }
  .memo-card-title { font-size: 15px; font-weight: 600; color: #F2F1EC; word-break: break-all;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .memo-card-preview {
    font-size: 13px; color: #8B8981; margin-top: 3px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: break-all;
  }
  .memo-card-date { font-size: 11px; color: #5F5E5A; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .memo-edit-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .memo-back {
    display: flex; align-items: center; gap: 5px;
    background: none; border: none; color: #C9C7BF;
    font-size: 14px; font-family: inherit; cursor: pointer; padding: 6px 4px;
  }
  .memo-back svg { width: 17px; height: 17px; }
  .memo-edit-actions { display: flex; gap: 8px; }
  .memo-action-btn {
    height: 36px; padding: 0 16px; border: none; border-radius: 9px;
    font-size: 13.5px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .memo-save-btn { background: #E8734A; color: #17181A; }
  .memo-del-btn { background: #343537; color: #C9C7BF; }
  .memo-title-input {
    width: 100%; padding: 12px 14px; margin-bottom: 10px;
    background: #222325; border: 1px solid #343537; border-radius: 11px;
    color: #F2F1EC; font-size: 16px; font-weight: 600; font-family: inherit; outline: none;
  }
  .memo-title-input::placeholder { color: #6E6C64; font-weight: 400; }
  .memo-text-input {
    width: 100%; padding: 12px 14px;
    background: #222325; border: 1px solid #343537; border-radius: 11px;
    color: #F2F1EC; font-size: 15px; font-family: inherit; outline: none;
    resize: none; line-height: 1.55; min-height: 160px; overflow: hidden;
  }
  .memo-text-input::placeholder { color: #6E6C64; }
  .memo-photos-header {
    display: flex; justify-content: space-between; align-items: center;
    margin: 16px 0 10px;
  }
  .memo-photos-label { font-size: 13px; color: #8B8981; }
  .memo-photo-add {
    display: flex; align-items: center; gap: 5px;
    background: #222325; border: 1px solid #343537; border-radius: 9px;
    color: #C9C7BF; font-size: 13px; font-family: inherit;
    padding: 7px 12px; cursor: pointer;
  }
  .memo-photo-add svg { width: 15px; height: 15px; }
  .memo-photo-add:disabled { opacity: 0.35; }
  .memo-photo-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .memo-photo-cell { position: relative; }
  .memo-photo-cell img {
    width: 96px; height: 96px; object-fit: cover; border-radius: 11px;
    display: block; cursor: pointer;
  }
  .memo-photo-x {
    position: absolute; top: -7px; right: -7px;
    width: 24px; height: 24px; border-radius: 50%;
    background: #343537; border: 2px solid #17181A; color: #E8E6DF;
    font-size: 13px; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .photo-viewer {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    display: none; align-items: center; justify-content: center;
    z-index: 200; cursor: zoom-out;
  }
  .photo-viewer.show { display: flex; }
  .photo-viewer img { max-width: 96vw; max-height: 92vh; border-radius: 8px; }
  .made-by {
    text-align: center; font-size: 11px; color: #4E4D49;
    margin-top: 34px; letter-spacing: 0.8px;
  }
  /* ===== PIN 잠금 ===== */
  .lock-screen {
    position: fixed; inset: 0; background: #17181A;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 500; padding: 24px;
  }
  .lock-icon {
    width: 58px; height: 58px; color: #E8734A; margin-bottom: 18px;
  }
  .lock-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.3px; }
  .lock-sub { font-size: 13px; color: #8B8981; margin-bottom: 26px; }
  .pin-dots { display: flex; gap: 14px; margin-bottom: 30px; }
  .pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid #5A5850; transition: all .15s;
  }
  .pin-dot.filled { background: #E8734A; border-color: #E8734A; }
  .lock-screen.shake .pin-dots { animation: shake .4s; }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)}
    40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)}
  }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 74px); gap: 14px; }
  .pin-key {
    width: 74px; height: 74px; border-radius: 50%;
    background: #222325; border: 1px solid #2E2F32;
    color: #F2F1EC; font-size: 24px; font-family: inherit; font-weight: 500;
    cursor: pointer;
  }
  .pin-key:active { background: #2E2F32; }
  .pin-key.blank { background: none; border: none; cursor: default; }
  .pin-key.fn { font-size: 14px; color: #8B8981; }
  .lock-err { font-size: 13px; color: #E8734A; height: 18px; margin-top: 16px; }
  .pin-setup-note { font-size: 12px; color: #6E6C64; margin-top: 20px; text-align: center; line-height: 1.6; }
  .faceid-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 24px; background: #222325; border: 1px solid #343537;
    border-radius: 11px; color: #C9C7BF; font-size: 14px; font-family: inherit;
    padding: 12px 20px; cursor: pointer;
  }
  .faceid-btn svg { width: 19px; height: 19px; color: #E8734A; }
  .faceid-btn:active { background: #2A2B2D; }
  .lock-btn {
    margin-top: 22px; background: none; border: 1px solid #343537;
    border-radius: 9px; color: #8B8981; font-size: 12.5px; font-family: inherit;
    padding: 8px 14px; cursor: pointer;
  }
  .banner {
    background: #3A1E18; border: 1px solid #6E3A2A; border-radius: 10px;
    padding: 14px; margin-bottom: 20px; font-size: 13px; line-height: 1.6;
    color: #F0C4B4; display: none;
  }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center;
    padding: 24px; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #212225; border: 1px solid #343537; border-radius: 16px;
    padding: 24px 22px 18px; width: 100%; max-width: 340px;
  }
  .modal-q { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
  .modal-item { font-size: 14px; color: #9A9890; margin: 0 0 22px; word-break: break-all; line-height: 1.5; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1; height: 46px; border: none; border-radius: 11px;
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .btn-cancel { background: #343537; color: #E8E6DF; }
  .btn-cancel:active { background: #3E3F41; }
  .btn-confirm { background: #E8734A; color: #17181A; }
  .btn-confirm:active { background: #d1633d; }
</style>
</head>
<body>
<div class="lock-screen" id="lock-screen">
  <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </svg>
  <div class="lock-title" id="lock-title">잠금 해제</div>
  <div class="lock-sub" id="lock-sub">PIN 4자리를 입력해줘</div>
  <div class="pin-dots" id="pin-dots"></div>
  <div class="pin-pad" id="pin-pad"></div>
  <div class="lock-err" id="lock-err"></div>
  <div id="faceid-slot"></div>
  <div class="pin-setup-note" id="pin-note"></div>
</div>

<div class="wrap" id="app-wrap" style="display:none">
  <div class="banner" id="config-banner">
    Firebase 설정이 아직 안 됐어. 아래 <b>&lt;script&gt;</b> 안의 <b>firebaseConfig</b> 값을 네 프로젝트 걸로 채워야 동기화가 작동해.
  </div>

  <div class="top">
    <div>
      <div class="date" id="date-label"></div>
      <div class="title">Tracker</div>
    </div>
    <button class="undo-btn" id="undo-btn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
      되돌리기
    </button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-btn-check">체크리스트</button>
    <button class="tab" id="tab-btn-sched">일정</button>
    <button class="tab" id="tab-btn-memo">메모</button>
    <button class="tab" id="tab-btn-routine">반복작업</button>
  </div>

  <div id="tab-check">
    <div id="list"></div>

    <div class="add-row">
      <textarea class="add-input" id="new-input" rows="1" placeholder="항목 추가"></textarea>
      <button class="add-btn" id="add-btn">+</button>
    </div>

    <div id="completed-section"></div>
  </div>

  <div id="tab-sched" style="display:none">
    <div id="sched-list"></div>

    <div class="add-row">
      <textarea class="add-input" id="sched-input" rows="1" placeholder="일정 추가"></textarea>
      <button class="add-btn" id="sched-add-btn">+</button>
    </div>
    <div class="sched-dt">
      <input type="date" id="sched-date">
      <input type="time" id="sched-time" value="09:00">
    </div>
  </div>

  <div id="tab-memo" style="display:none">
    <div id="memo-list-view">
      <div class="memo-toolbar">
        <button class="memo-new-btn" id="memo-new-btn">+ 새 메모</button>
      </div>
      <div id="memo-list"></div>
    </div>
    <div id="memo-edit-view" style="display:none"></div>
  </div>

  <div id="tab-routine" style="display:none">
    <div id="routine-section"></div>
  </div>

  <div class="status sync" id="status"></div>

  <div style="text-align:center; margin-top:26px;">
    <button id="lock-now-btn" style="background:none; border:1px solid #2A2B2D; border-radius:9px; color:#5F5E5A; font-size:12px; font-family:inherit; padding:7px 14px; cursor:pointer;">잠그기</button>
  </div>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2aUEijSBivYAdZbaXGnnO9rg6d8g-Pvg",
  authDomain: "check-91de6.firebaseapp.com",
  projectId: "check-91de6",
  storageBucket: "check-91de6.firebasestorage.app",
  messagingSenderId: "400856324106",
  appId: "1:400856324106:web:ada30a3ebec293a4ae67f3"
};

const DEFAULT_ITEMS = [
  {id:'d1', text:'오늘 할 일 정하기'},
  {id:'d2', text:'운동 30분'},
  {id:'d3', text:'스킨케어 루틴'}

const $ = id => document.getElementById(id);
const isTouch = window.matchMedia('(pointer: coarse)').matches
  || ('ontouchstart' in window)
  || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);

const LOCAL_KEY = 'checklist_last_state_v1';
const TAB_KEY = 'checklist_tab';

function loadLocalSnapshot(){
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.items)) return null;
    if(!Array.isArray(parsed.completed)) parsed.completed = [];
    if(!Array.isArray(parsed.routines)) parsed.routines = [];
    return parsed;
  } catch(e){ return null; }
}

function saveLocalSnapshot(s){
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); } catch(e){}
}

let state = { items: [], completed: [], routines: [] };
let memos = [];
let editingId = null;
let dueEditId = null;
let routineForm = null;
let undoStack = [];
let showCompleted = false;
let modalAction = null;
let loaded = false;
let memosLoaded = false;
let currentTab = 'check';
let memoView = 'list';
let editingMemo = null;
let editingMemoOrig = '';

const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
const ICON_SAVE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const ICON_CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
const ICON_RESTORE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
const ICON_DRAG = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>';
const ICON_REPEAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>';
const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
const ICON_CAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
const ICON_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';

const DAYS = ['일','월','화','수','목','금','토'];
const UNIT_LABEL = { day: '일', week: '주', month: '개월' };

function pad(n){ return String(n).padStart(2,'0'); }

function updateClock(){
  const n = new Date();
  $('date-label').textContent =
    `${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 (${DAYS[n.getDay()]}) ${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
}
setInterval(updateClock, 1000);
setInterval(() => { if(!editingId && !dueEditId && !routineForm && currentTab !== 'memo') render(); }, 60000);
updateClock();

function fmtTime(ts){
  const n = new Date(ts);
  return `${n.getMonth()+1}/${n.getDate()} ${pad(n.getHours())}:${pad(n.getMinutes())}`;
}

function fmtDue(ts){
  const n = new Date(ts);
  const now = new Date();
  const y = n.getFullYear() === now.getFullYear() ? '' : (n.getFullYear() + '.');
  return `${y}${n.getMonth()+1}.${n.getDate()} ${pad(n.getHours())}:${pad(n.getMinutes())}`;
}

function fmtDateOnly(ts){
  const n = new Date(ts);
  const now = new Date();
  const y = n.getFullYear() === now.getFullYear() ? '' : (n.getFullYear() + '.');
  return `${y}${n.getMonth()+1}.${n.getDate()}`;
}

function todayStart(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
}

function addInterval(baseTs, n, unit){
  const d = new Date(baseTs);
  if(unit === 'day') d.setDate(d.getDate() + n);
  else if(unit === 'week') d.setDate(d.getDate() + n*7);
  else d.setMonth(d.getMonth() + n);
  return d.getTime();
}

function dateInputValue(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

function setStatus(text, isErr){
  const el = $('status');
  el.textContent = text;
  el.className = 'status ' + (isErr ? 'err' : 'sync');
}

function autoResize(ta){
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}

/* ============ 탭 ============ */

function showTab(name){
  currentTab = name;
  try { localStorage.setItem(TAB_KEY, name); } catch(e){}
  ['check','sched','memo','routine'].forEach(t => {
    $('tab-' + t).style.display = name === t ? '' : 'none';
    $('tab-btn-' + t).classList.toggle('active', name === t);
  });
  $('undo-btn').style.display = name === 'memo' ? 'none' : '';
  if(name === 'memo') renderMemo();
  else render();
}
$('tab-btn-check').onclick = () => showTab('check');
$('tab-btn-sched').onclick = () => showTab('sched');
$('tab-btn-memo').onclick = () => showTab('memo');
$('tab-btn-routine').onclick = () => showTab('routine');

/* ============ 초기화 ============ */

let fbRefs = null;

if(!firebaseConfig.apiKey || !firebaseConfig.projectId){
  $('config-banner').style.display = 'block';
  renderLocal();
} else {
  const snapshot = loadLocalSnapshot();
  if(snapshot){
    state = snapshot;
    setStatus('불러온 기록 표시 중…');
    render();
  }
  startFirebase();
}

try {
  const savedTab = localStorage.getItem(TAB_KEY);
  if(savedTab && ['check','sched','memo','routine'].includes(savedTab) && savedTab !== 'check') showTab(savedTab);
} catch(e){}

function startFirebase(){
  let app, db, auth, docRef;
  try {
    app = initializeApp(firebaseConfig);
    try {
      db = initializeFirestore(app, {
        localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
      });
    } catch(cacheErr){
      db = getFirestore(app);
    }
    auth = getAuth(app);
    docRef = doc(db, "checklist", "main");
    fbRefs = { db, docRef };
  } catch(e){
    setStatus('Firebase 초기화 실패: ' + e.message, true);
    renderLocal();
    return;
  }

  setStatus('연결 중…');

  onAuthStateChanged(auth, user => {
    if(!user) return;

    onSnapshot(docRef, snap => {
      if(!snap.exists()){
        if(!snap.metadata.fromCache){
          setDoc(docRef, { items: DEFAULT_ITEMS, completed: [], routines: [] });
        }
        return;
      }
      const data = snap.data();
      state = {
        items: (data.items || []).map(i => { const o = { id: i.id, text: i.text }; if(i.due) o.due = i.due; return o; }),
        completed: (data.completed || []).map(c => { const o = { id: c.id, text: c.text, doneAt: c.doneAt }; if(c.due) o.due = c.due; if(c.routine) o.routine = true; return o; }),
        routines: (data.routines || []).map(r => { const o = { id: r.id, text: r.text, intervalN: r.intervalN, intervalUnit: r.intervalUnit, nextDue: r.nextDue }; if(r.lastDone) o.lastDone = r.lastDone; return o; })
      };
      loaded = true;
      saveLocalSnapshot(state);
      setStatus(snap.metadata.fromCache ? '캐시에서 불러옴' : '동기화됨');
      if(!editingId && !dueEditId && !routineForm) render();
    }, err => {
      setStatus('동기화 오류: ' + err.message, true);
    });

    onSnapshot(collection(db, "memos"), snap => {
      memos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      memosLoaded = true;
      if(currentTab === 'memo' && memoView === 'list') renderMemoList();
    }, err => {
      if(currentTab === 'memo') setStatus('메모 동기화 오류: ' + err.message, true);
    });
  });

  signInAnonymously(auth).catch(e => {
    setStatus('로그인 실패: ' + e.message + ' (익명 인증을 켰는지 확인)', true);
  });

  window.__save = async () => {
    if(!loaded) return;
    try {
      await setDoc(docRef, { items: state.items, completed: state.completed, routines: state.routines });
    } catch(e){
      setStatus('저장 실패: ' + e.message, true);
    }
  };
}

function renderLocal(){
  state = { items: DEFAULT_ITEMS.map(i => ({...i})), completed: [], routines: [] };
  loaded = true;
  window.__save = async () => {};
  render();
}

function mutate(fn){
  if(!loaded) return;
  undoStack.push(JSON.stringify(state));
  if(undoStack.length > 50) undoStack.shift();
  fn();
  saveLocalSnapshot(state);
  window.__save();
  render();
}

function undo(){
  if(!undoStack.length) return;
  state = JSON.parse(undoStack.pop());
  editingId = null;
  dueEditId = null;
  routineForm = null;
  saveLocalSnapshot(state);
  window.__save();
  render();
}

function render(){
  renderChecklist();
  renderSchedule();
  renderRoutines();
  renderCompleted();
  $('undo-btn').disabled = undoStack.length === 0;
}

/* ============ 공통 항목 렌더 ============ */

function renderItemInto(root, item, withDrag){
  const row = document.createElement('div');
  row.className = 'item';

  if(editingId === item.id){
    row.classList.add('editing');
    const input = document.createElement('textarea');
    input.className = 'edit-input';
    input.rows = 1;
    input.value = item.text;

    const commit = () => {
      const v = input.value.trim();
      if(v && v !== item.text){
        mutate(() => { item.text = v; editingId = null; });
      } else {
        editingId = null; render();
      }
    };
    const cancel = () => { editingId = null; render(); };
    input.onkeydown = e => {
      if(e.key === 'Enter' && !e.shiftKey && !isTouch){ e.preventDefault(); commit(); }
      if(e.key === 'Escape') cancel();
    };
    input.oninput = () => autoResize(input);
    row.appendChild(input);

    const saveBtn = document.createElement('button');
    saveBtn.className = 'icon-btn save';
    saveBtn.innerHTML = ICON_SAVE;
    saveBtn.setAttribute('aria-label', '저장');
    saveBtn.onclick = commit;
    row.appendChild(saveBtn);

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'icon-btn cancel';
    cancelBtn.innerHTML = ICON_X;
    cancelBtn.setAttribute('aria-label', '취소');
    cancelBtn.onclick = cancel;
    row.appendChild(cancelBtn);

    root.appendChild(row);
    setTimeout(() => { input.focus(); autoResize(input); input.setSelectionRange(input.value.length, input.value.length); }, 0);
    return;
  }

  if(withDrag){
    row.dataset.itemId = item.id;
    const handle = document.createElement('div');
    handle.className = 'drag-handle';
    handle.innerHTML = ICON_DRAG;
    handle.setAttribute('aria-label', '순서 변경');
    row.appendChild(handle);
    initDrag(handle, row, root);
  }

  const cb = document.createElement('div');
  cb.className = 'checkbox';
  cb.setAttribute('role', 'button');
  cb.setAttribute('aria-label', '완료');
  cb.onclick = () => completeItem(item.id);
  row.appendChild(cb);

  const text = document.createElement('span');
  text.className = 'item-text';
  text.textContent = item.text;

  const main = document.createElement('div');
  main.className = 'item-main';
  main.appendChild(text);

  if(item.due){
    const overdue = item.due < Date.now();
    const badgeRow = document.createElement('div');
    badgeRow.className = 'due-badge-row';

    const badge = document.createElement('div');
    badge.className = 'due-badge' + (overdue ? ' overdue' : '');
    badge.innerHTML = ICON_CLOCK + '<span>' + fmtDue(item.due) + '</span>';
    badgeRow.appendChild(badge);

    const calBtn = document.createElement('button');
    calBtn.className = 'due-cal-btn';
    calBtn.innerHTML = ICON_CAL + '캘린더';
    calBtn.setAttribute('aria-label', '캘린더에 추가');
    calBtn.onclick = () => downloadICS(item);
    badgeRow.appendChild(calBtn);

    main.appendChild(badgeRow);
  }
  row.appendChild(main);

  const dueBtn = document.createElement('button');
  const overdueNow = item.due && item.due < Date.now();
  dueBtn.className = 'icon-btn due' + (item.due ? (overdueNow ? ' overdue' : ' set') : '');
  dueBtn.innerHTML = ICON_CLOCK;
  dueBtn.setAttribute('aria-label', '일정 지정');
  dueBtn.onclick = () => { dueEditId = (dueEditId === item.id ? null : item.id); render(); };
  row.appendChild(dueBtn);

  const editBtn = document.createElement('button');
  editBtn.className = 'icon-btn edit';
  editBtn.innerHTML = ICON_EDIT;
  editBtn.setAttribute('aria-label', '수정');
  editBtn.onclick = () => { editingId = item.id; render(); };
  row.appendChild(editBtn);

  const delBtn = document.createElement('button');
  delBtn.className = 'icon-btn del';
  delBtn.innerHTML = ICON_X;
  delBtn.setAttribute('aria-label', '삭제');
  delBtn.onclick = () => mutate(() => {
    state.items = state.items.filter(i => i.id !== item.id);
  });
  row.appendChild(delBtn);

  root.appendChild(row);

  if(dueEditId === item.id){
    root.appendChild(buildDueForm(item));
  }
}

/* ============ 체크리스트 탭 (일정 없는 항목) ============ */

function renderChecklist(){
  const root = $('list');
  root.innerHTML = '';

  const plain = state.items.filter(i => !i.due);

  if(plain.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '항목이 없어. 아래에서 추가해봐.';
    root.appendChild(empty);

  plain.forEach(item => renderItemInto(root, item, true));
}

/* ============ 일정 탭 (일정 있는 항목, 날짜순) ============ */

function renderSchedule(){
  const root = $('sched-list');
  root.innerHTML = '';

  const scheduled = state.items.filter(i => i.due).sort((a,b) => a.due - b.due);

  if(scheduled.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '일정이 없어. 아래에서 날짜와 함께 추가해봐.';
    root.appendChild(empty);
    return;
  }

  scheduled.forEach(item => renderItemInto(root, item, false));
}

/* ============ ICS ============ */

function escapeICS(s){
  return s.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
}

function icsDate(ts){
  const d = new Date(ts);
  return d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z';
}

function downloadICS(item){
  const firstLine = (item.text.split('\n')[0] || '일정').slice(0, 60);
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//x3phyr checklist//KO',
    'BEGIN:VEVENT',
    'UID:' + item.id + '@x3phyr-checklist',
    'DTSTAMP:' + icsDate(Date.now()),
    'DTSTART:' + icsDate(item.due),
    'DTEND:' + icsDate(item.due + 30*60000),
    'SUMMARY:' + escapeICS(firstLine),
    'DESCRIPTION:' + escapeICS(item.text),
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:' + escapeICS(firstLine),
    'TRIGGER:-PT1H',
    'END:VALARM',
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:' + escapeICS(firstLine),
    'TRIGGER:PT0M',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = firstLine.replace(/[\\/:*?"<>|]/g, '') + '.ics';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function buildDueForm(item){
  const wrap = document.createElement('div');
  wrap.className = 'due-form';
  wrap.style.padding = '4px 4px 14px 54px';
  wrap.style.borderBottom = '1px solid #2A2B2D';

  const row1 = document.createElement('div');
  row1.className = 'due-form-row';

  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  const timeInput = document.createElement('input');
  timeInput.type = 'time';

  if(item.due){
    const d = new Date(item.due);
    dateInput.value = dateInputValue(item.due);
    timeInput.value = pad(d.getHours()) + ':' + pad(d.getMinutes());
  } else {
    dateInput.value = dateInputValue(Date.now());
    timeInput.value = '09:00';
  }

  row1.appendChild(dateInput);
  row1.appendChild(timeInput);
  wrap.appendChild(row1);

  const btnRow = document.createElement('div');
  btnRow.className = 'due-form-btns';

  const saveBtn = document.createElement('button');
  saveBtn.className = 'due-save';
  saveBtn.textContent = '저장';
  saveBtn.onclick = () => {
    if(!dateInput.value) return;
    const ts = new Date(dateInput.value + 'T' + (timeInput.value || '00:00')).getTime();
    mutate(() => { item.due = ts; });
    dueEditId = null;
    render();
  };

  const clearBtn = document.createElement('button');
  clearBtn.className = 'due-clear';
  clearBtn.textContent = '일정 없음';
  clearBtn.onclick = () => {
    mutate(() => { delete item.due; });
    dueEditId = null;
    render();
  };

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'due-cancel';
  cancelBtn.textContent = '취소';
  cancelBtn.onclick = () => { dueEditId = null; render(); };

  btnRow.appendChild(saveBtn);
  btnRow.appendChild(clearBtn);
  btnRow.appendChild(cancelBtn);
  wrap.appendChild(btnRow);

  return wrap;
}

/* ============ 드래그 정렬 ============ */

function initDrag(handle, row, listRoot){
  let dragging = false;
  let rows = [];

  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    dragging = true;
    rows = Array.from(listRoot.querySelectorAll('.item[data-item-id]'));
    row.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);

    const onMove = ev => {
      if(!dragging) return;
      const y = ev.clientY;
      rows.forEach(r => {
        if(r === row) return;
        r.classList.remove('drag-over-top', 'drag-over-bottom');
        const rect = r.getBoundingClientRect();
        if(y > rect.top && y < rect.bottom){
          if(y < rect.top + rect.height/2) r.classList.add('drag-over-top');
          else r.classList.add('drag-over-bottom');
        }
      });
    };

    const onUp = ev => {
      dragging = false;
      handle.releasePointerCapture(ev.pointerId);
      row.classList.remove('dragging');

      let targetId = null, before = true;
      for(const r of rows){
        if(r.classList.contains('drag-over-top')){ targetId = r.dataset.itemId; before = true; }
        if(r.classList.contains('drag-over-bottom')){ targetId = r.dataset.itemId; before = false; }
        r.classList.remove('drag-over-top', 'drag-over-bottom');
      }

      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);

      if(!targetId || targetId === row.dataset.itemId) return;
      reorder(row.dataset.itemId, targetId, before);
    };

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

function reorder(draggedId, targetId, before){
  mutate(() => {
    const fromIdx = state.items.findIndex(i => i.id === draggedId);
    if(fromIdx === -1) return;
    const [moved] = state.items.splice(fromIdx, 1);
    let toIdx = state.items.findIndex(i => i.id === targetId);
    if(toIdx === -1){ state.items.splice(fromIdx, 0, moved); return; }
    if(!before) toIdx += 1;
    state.items.splice(toIdx, 0, moved);
  });
}

/* ============ 완료 처리 ============ */

function completeItem(id){
  const item = state.items.find(i => i.id === id);
  if(!item) return;
  mutate(() => {
    state.items = state.items.filter(i => i.id !== id);
    const rec = { id: item.id, text: item.text, doneAt: Date.now() };
    if(item.due) rec.due = item.due;
    state.completed.push(rec);
  });
}

function restoreItem(id){
  const c = state.completed.find(x => x.id === id);
  if(!c) return;
  mutate(() => {
    state.completed = state.completed.filter(x => x.id !== id);
    const item = { id: c.id, text: c.text };
    if(c.due) item.due = c.due;
    state.items.push(item);
  });
}

function completeRoutine(id){
  const r = state.routines.find(x => x.id === id);

    state.completed.push({ id: 'rc_' + now, text: r.text, doneAt: now, routine: true });
    r.lastDone = now;
    r.nextDue = addInterval(todayStart(), r.intervalN, r.intervalUnit);

}

function buildRoutineForm(routine){
  const wrap = document.createElement('div');
  wrap.className = 'rt-form';

  const textInput = document.createElement('textarea');
  textInput.rows = 1;
  textInput.placeholder = '반복할 일 (예: 로봇청소기 통비우기)';
  if(routine) textInput.value = routine.text;
  textInput.oninput = () => autoResize(textInput);
  wrap.appendChild(textInput);

  const row1 = document.createElement('div');
  row1.className = 'rt-form-row';

  const label1 = document.createElement('span');
  label1.className = 'rt-form-label';
  label1.textContent = '주기';
  row1.appendChild(label1);

  const nInput = document.createElement('input');
  nInput.type = 'number';
  nInput.min = '1';
  nInput.value = routine ? routine.intervalN : 1;
  row1.appendChild(nInput);

  const unitSel = document.createElement('select');
  [['day','일'],['week','주'],['month','개월']].forEach(([v,l]) => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = l;
    unitSel.appendChild(opt);
  });
  unitSel.value = routine ? routine.intervalUnit : 'month';
  row1.appendChild(unitSel);
  wrap.appendChild(row1);

  const row2 = document.createElement('div');
  row2.className = 'rt-form-row';

  const label2 = document.createElement('span');
  label2.className = 'rt-form-label';
  label2.textContent = '다음 예정일';
  row2.appendChild(label2);

  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  let dateTouched = !!routine;

  const calcDefault = () => {
    const n = parseInt(nInput.value, 10) || 1;
    return dateInputValue(addInterval(todayStart(), n, unitSel.value));
  };
  dateInput.value = routine ? dateInputValue(routine.nextDue) : calcDefault();
  dateInput.onchange = () => { dateTouched = true; };
  nInput.oninput = () => { if(!dateTouched) dateInput.value = calcDefault(); };
  unitSel.onchange = () => { if(!dateTouched) dateInput.value = calcDefault(); };

  row2.appendChild(dateInput);
  wrap.appendChild(row2);

  const btnRow = document.createElement('div');
  btnRow.className = 'rt-form-btns';

  const saveBtn = document.createElement('button');
  saveBtn.className = 'due-save';
  saveBtn.textContent = routine ? '저장' : '추가';
  saveBtn.onclick = () => {
    const text = textInput.value.trim();
    const n = parseInt(nInput.value, 10);
    if(!text || !n || n < 1 || !dateInput.value) return;
    const nextDue = new Date(dateInput.value + 'T00:00').getTime();
    if(routine){
      mutate(() => {
        routine.text = text;
        routine.intervalN = n;
        routine.intervalUnit = unitSel.value;
        routine.nextDue = nextDue;
      });
    } else {
      mutate(() => {
        state.routines.push({ id: 'rt_' + Date.now(), text, intervalN: n, intervalUnit: unitSel.value, nextDue });
      });
    }
    routineForm = null;
    render();
  };

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'due-cancel';
  cancelBtn.textContent = '취소';
  cancelBtn.onclick = () => { routineForm = null; render(); };

  btnRow.appendChild(saveBtn);
  btnRow.appendChild(cancelBtn);
  wrap.appendChild(btnRow);

  setTimeout(() => { if(!routine) textInput.focus(); autoResize(textInput); }, 0);

  return wrap;
}

$('photo-input').onchange = async e => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if(!editingMemo) return;
  for(const f of files){
    if(editingMemo.photos.length >= 3) break;
    try {
      const dataUrl = await compressImage(f);
      editingMemo.photos.push(dataUrl);
    } catch(err){}
  }
  renderMemoEdit();
};

function compressImage(file, maxDim = 1000, quality = 0.72){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지 로드 실패')); };
    img.src = url;
  });
}

}

function buildPad(){
  const pad = $('pin-pad');
  pad.innerHTML = '';
  const keys = ['1','2','3','4','5','6','7','8','9','', '0','del'];
  keys.forEach(k => {
    const b = document.createElement('button');
    if(k === ''){
      b.className = 'pin-key blank';
      b.disabled = true;
    } else if(k === 'del'){
      b.className = 'pin-key fn';
      b.textContent = '지움';
      b.onclick = () => { pinBuf = pinBuf.slice(0,-1); renderDots(); };
    } else {
      b.className = 'pin-key';
      b.textContent = k;
      b.onclick = () => pushPin(k);
    }
    pad.appendChild(b);
  });
}

function pushPin(k){
  if(pinBuf.length >= 4) return;
  pinBuf += k;
  renderDots();
  if(pinBuf.length === 4) setTimeout(submitPin, 120);
}

function shakeErr(msg){
  $('lock-err').textContent = msg;
  const ls = $('lock-screen');
  ls.classList.add('shake');
  setTimeout(() => ls.classList.remove('shake'), 420);
  pinBuf = '';
  renderDots();
}

function submitPin(){
  const entered = pinBuf;
  if(pinMode === 'setup'){
    pinFirst = entered;
    pinMode = 'confirm';
    pinBuf = '';
    renderDots();
    $('lock-title').textContent = 'PIN 확인';
    $('lock-sub').textContent = '한 번 더 입력해줘';
    $('lock-err').textContent = '';
    return;
  }
  if(pinMode === 'confirm'){
    if(entered === pinFirst){
      try { localStorage.setItem(PIN_KEY, entered); } catch(e){}
      if(bioSupported() && !getBioCred()){
        $('lock-title').textContent = 'Face ID 사용';
        $('lock-sub').textContent = 'PIN 대신 얼굴로 빠르게 열 수 있어';
        $('pin-dots').style.display = 'none';
        $('pin-pad').style.display = 'none';
        $('pin-note').textContent = '';
        showFaceIdRegister();
      } else {
        unlockApp();
      }
    } else {
      pinMode = 'setup';
      pinFirst = '';
      $('lock-title').textContent = 'PIN 설정';
      $('lock-sub').textContent = '사용할 PIN 4자리를 입력해줘';
      shakeErr('입력한 PIN이 서로 달라. 다시 설정해줘.');
    }
    return;
  }
  // enter
  if(entered === getSavedPin()){
    unlockApp();
  } else {
    shakeErr('PIN이 맞지 않아');
  }
}

function unlockApp(){
  try { sessionStorage.setItem(PIN_OK_KEY, '1'); } catch(e){}
  $('lock-screen').style.display = 'none';
  $('app-wrap').style.display = '';
}

function lockApp(){
  try { sessionStorage.removeItem(PIN_OK_KEY); } catch(e){}
  location.reload();
}

/* ---- Face ID (WebAuthn) ---- */

const BIO_KEY = 'tracker_bio_cred';
const ICON_FACEID = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><path d="M8 20H6a2 2 0 0 1-2-2v-2"/><line x1="9" y1="10" x2="9" y2="11"/><line x1="15" y1="10" x2="15" y2="11"/><path d="M12 9.5v3.5h-1"/><path d="M9 15.5s1.2 1 3 1 3-1 3-1"/></svg>';

function bioSupported(){
  return !!(window.PublicKeyCredential && navigator.credentials);
}

function getBioCred(){
  try { return localStorage.getItem(BIO_KEY); } catch(e){ return null; }
}

function b64ToBuf(s){
  const bin = atob(s.replace(/-/g,'+').replace(/_/g,'/'));
  const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}

function bufToB64(buf){
  const bytes = new Uint8Array(buf);
  let s = '';
  for(let i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function registerBio(){
  if(!bioSupported()) return false;
  try {
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    const userId = new Uint8Array(16);
    crypto.getRandomValues(userId);

    const cred = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: 'Tracker', id: location.hostname },
        user: { id: userId, name: 'tracker-user', displayName: 'Tracker' },
        pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
        authenticatorSelection: {
          authenticatorAttachment: 'platform',
          userVerification: 'required',
          residentKey: 'preferred'
        },
        timeout: 60000,
        attestation: 'none'
      }
    });
    if(!cred) return false;
    localStorage.setItem(BIO_KEY, bufToB64(cred.rawId));
    return true;
  } catch(e){
    return false;
  }
}

async function verifyBio(){
  const credId = getBioCred();
  if(!credId || !bioSupported()) return false;
  try {
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge,
        rpId: location.hostname,
        allowCredentials: [{ type:'public-key', id: b64ToBuf(credId), transports:['internal'] }],
        userVerification: 'required',
        timeout: 60000
      }
    });
    return !!assertion;
  } catch(e){
    return false;
  }
}

function showFaceIdButton(){
  const slot = $('faceid-slot');
  slot.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'faceid-btn';
  btn.innerHTML = ICON_FACEID + 'Face ID로 열기';
  btn.onclick = async () => {
    const ok = await verifyBio();
    if(ok) unlockApp();
  };
  slot.appendChild(btn);
}

function showFaceIdRegister(){
  const slot = $('faceid-slot');
  slot.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'faceid-btn';
  btn.innerHTML = ICON_FACEID + 'Face ID 등록하기';
  btn.onclick = async () => {
    const ok = await registerBio();
    if(ok){
      btn.innerHTML = ICON_FACEID + '등록 완료';
      setTimeout(() => unlockApp(), 600);
    }
  };
  slot.appendChild(btn);

  const skip = document.createElement('button');
  skip.className = 'lock-btn';
  skip.textContent = '나중에';
  skip.onclick = () => unlockApp();
  slot.appendChild(skip);
}

function initLock(){
  buildPad();
  renderDots();

  let alreadyOk = false;
  try { alreadyOk = sessionStorage.getItem(PIN_OK_KEY) === '1'; } catch(e){}

  const saved = getSavedPin();

  if(!saved){
    pinMode = 'setup';
    $('lock-title').textContent = 'PIN 설정';
    $('lock-sub').textContent = '사용할 PIN 4자리를 입력해줘';
    $('pin-note').textContent = '이 기기에 저장돼. 기기마다 처음 한 번씩 설정하면 돼.';
    return;
  }

  if(alreadyOk){
    unlockApp();
    return;
  }

  pinMode = 'enter';
  $('lock-title').textContent = '잠금 해제';
  $('lock-sub').textContent = 'PIN 4자리를 입력해줘';

  const resetBtn = document.createElement('button');
  resetBtn.className = 'lock-btn';
  resetBtn.textContent = 'PIN 잊어버렸어';
  resetBtn.onclick = () => {
    if(confirm('PIN을 초기화할까? (앱 데이터는 그대로 유지돼)')){
      try { localStorage.removeItem(PIN_KEY); localStorage.removeItem(BIO_KEY); } catch(e){}
      location.reload();
    }
  };
  $('pin-note').appendChild(resetBtn);

  // Face ID 등록돼 있으면 자동 시도 → 실패/취소 시 조용히 PIN 화면 유지
  if(getBioCred() && bioSupported()){
    showFaceIdButton();
    setTimeout(async () => {
      const ok = await verifyBio();
      if(ok) unlockApp();
    }, 250);
  }
}

document.addEventListener('keydown', e => {
  if($('lock-screen').style.display === 'none') return;
  if(e.key >= '0' && e.key <= '9') pushPin(e.key);
  if(e.key === 'Backspace'){ pinBuf = pinBuf.slice(0,-1); renderDots(); }
});

$('lock-now-btn').onclick = lockApp;

initLock();

</script>
